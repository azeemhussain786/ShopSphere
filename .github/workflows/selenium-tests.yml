name: ShopSphere Selenium CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium-tests:
    name: Selenium Automated Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Verify Google Chrome installation
        run: |
          echo "=== Google Chrome Version ==="
          google-chrome --version
          which google-chrome

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start ShopSphere Flask application
        run: |
          echo "Starting ShopSphere Flask app in background on 127.0.0.1:5000..."
          python app.py > flask.log 2>&1 &
          echo "Flask process launched."

      - name: Wait for ShopSphere server readiness
        run: |
          echo "Verifying server availability at http://127.0.0.1:5000..."
          max_retries=30
          count=0
          until curl -s -f -o /dev/null "http://127.0.0.1:5000" || [ $count -ge $max_retries ]; do
            sleep 1
            count=$((count + 1))
            echo "Waiting for Flask server... ($count/$max_retries)"
          done

          if [ $count -ge $max_retries ]; then
            echo "::error::ShopSphere Flask server failed to respond within $max_retries seconds!"
            echo "=== Flask Startup Output Logs ==="
            cat flask.log
            exit 1
          fi

          echo "ShopSphere server is ready and responding at http://127.0.0.1:5000!"

      - name: Run Selenium test suite (Headless)
        run: |
          mkdir -p reports test-results/screenshots
          pytest --headless -v -s --html=reports/test_execution_report.html --self-contained-html

      - name: Upload Test Execution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-report
          path: reports/test_execution_report.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Flask Application Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flask-server-logs
          path: flask.log
          if-no-files-found: ignore
          retention-days: 14
